plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.185'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    // NeoForged Maven
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases/"
    }
    // Cloth Config repository
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
    // JEI Maven repository
    maven {
        name = "Progwml6 (JEI)"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    // MrCrayfish Maven for Controllable mod
    maven {
        name = "MrCrayfish"
        url = "https://maven.mrcrayfish.com/repository/maven-public/"
    }
    // KubeJS and Rhino dependencies
    maven {
        name = "Latvian Mods"
        url = "https://maven.latvian.dev/"
    }
    // CurseForge Maven for other mods
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    
    // === Repositórios adicionais do SuperbWarfare ===
    // GeckoLib
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    
    // JEI and Patchouli Maven (atualizado)
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
            includeGroup "vazkii.patchouli"
        }
    }

    // KosmX Maven for Player Animator
    maven {
        name "Kosmx's Maven"
        url "https://maven.kosmx.dev/"
        content {
            // Permite a API principal
            includeGroup "io.github.kosmx.player-anim"
            // Permite a biblioteca interna (dependência transitiva)
            includeGroup "dev.kosmx.player-anim"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        workingDirectory project.file('run-data')
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // === Dependências atualizadas baseadas no SuperbWarfare 1.21.1 ===
    
    // GeckoLib - Biblioteca de animação (usado no SuperbWarfare)
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.5"
    
    // LuaJ - Para sistema de animação e scripting
    implementation 'org.luaj:luaj-jse:3.0.1'
    
    // Apache Commons Math - Para sistema de recuo e interpolação
    implementation 'org.apache.commons:commons-math3:3.6.1'
    
    // Cloth Config API - Versão confirmada no SuperbWarfare
    implementation "me.shedaniel.cloth:cloth-config-neoforge:15.0.140"
    
    // JEI - Usando versões do SuperbWarfare para compatibilidade
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    
    // Player Animator - Versão confirmada no SuperbWarfare
    implementation "curse.maven:playeranimator-658587:6024462"
    
    // Player Animator - API para animações customizadas (VERSÃO CORRETA para MC 1.21.1)
    implementation 'dev.kosmx.player-anim:player-animation-lib-forge:2.0.1+1.21.1'

    // Controllable - Para suporte a controles/joysticks (opcional)
    compileOnly "curse.maven:controllable-317269:6277379"
    localRuntime "curse.maven:controllable-317269:6277379"
    
    // Framework - Dependência para o Controllable
    implementation "curse.maven:framework-549225:6531439"
    
    // KubeJS - Para integração de scripts (opcional)
    compileOnly "curse.maven:kubejs-238086:${kubejs_file_id}"
    localRuntime "curse.maven:kubejs-238086:${kubejs_file_id}"
    
    // Rhino - Dependência do KubeJS para execução de scripts JavaScript
    compileOnly "curse.maven:rhino-416294:6184623"
    localRuntime "curse.maven:rhino-416294:6184623"
    
    // Shoulder Surfing Reloaded - Compatibilidade de camera (opcional)
    compileOnly "curse.maven:shoulder-surfing-reloaded-243190:${shoulder_surfing_file_id}"
    localRuntime "curse.maven:shoulder-surfing-reloaded-243190:${shoulder_surfing_file_id}"
    
    // Carry On - Compatibilidade para transporte de blocos (opcional)
    compileOnly "curse.maven:carry-on-274259:${carry_on_file_id}"
    localRuntime "curse.maven:carry-on-274259:${carry_on_file_id}"
    
    // === Mods opcionais adicionais do SuperbWarfare para teste ===
    // Jade - Tooltip avançado (do SuperbWarfare)
    implementation "curse.maven:jade-324717:6291517"
    
    // Cold Sweat - Sistema de temperatura (do SuperbWarfare) 
    implementation "curse.maven:cold-sweat-506194:6176789"
    
    // Better Combat - Sistema de combate aprimorado (do SuperbWarfare)
    implementation "curse.maven:better-combat-by-daedelus-639842:6532547"
    
    // Iris - Para compatibilidade com shaders (opcional)
    compileOnly "curse.maven:irisshaders-455508:${iris_file_id}"
    localRuntime "curse.maven:irisshaders-455508:${iris_file_id}"

    // CORREÇÃO: Usando o Project ID e File ID corretos para o Sodium.
    localRuntime "curse.maven:sodium-394468:6382651"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ["-Xmaxerrs", "10000", "-Xlint:none"]
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

java {
    withSourcesJar()
}
